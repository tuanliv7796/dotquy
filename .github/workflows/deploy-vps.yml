name: Deploy website to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotquy-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_URL: https://thanhtuan.online/dotquy
      PUBLIC_OTA_MANIFEST_URL: https://thanhtuan.online/dotquy/ota/manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build website and native-compatible OTA
        run: npm run build:vps
      - name: Install Chromium and run safety gates
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --workers=2
      - name: Write deployment metadata
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('dist-web/deployment.json', JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            builtAt: new Date().toISOString(),
          }) + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: production-website
          path: dist-web/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: production-website
          path: site
      - name: Publish tested static files
        id: publish
        working-directory: source
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current" != "$SOURCE_SHA" ]]; then
            echo 'Skipping superseded build.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parent="$(git ls-remote origin refs/heads/deploy-production | cut -f1)"
          parent_args=()
          if [[ -n "$parent" ]]; then
            git fetch --depth=1 origin refs/heads/deploy-production
            parent_args=(-p "$parent")
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/dotquy-production-index"
          git read-tree --empty
          git --work-tree="$GITHUB_WORKSPACE/site" add --all --force
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" "${parent_args[@]}" -m "Deploy $SOURCE_SHA")"
          git push origin "$commit:refs/heads/deploy-production"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Wait for VPS and verify public deployment
        if: steps.publish.outputs.ready == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 15 \
              "https://thanhtuan.online/dotquy/deployment.json?sha=$SOURCE_SHA&attempt=$attempt" \
              | jq -e --arg sha "$SOURCE_SHA" '.sha == $sha' >/dev/null; then
              curl --fail --silent --show-error --max-time 20 \
                https://thanhtuan.online/dotquy/so-cuu/ >/dev/null
              echo "Deployed $SOURCE_SHA to https://thanhtuan.online/dotquy/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::VPS has not confirmed this deployment. Check dotquy-sync.service.'
          exit 1
