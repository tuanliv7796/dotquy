# Static upstream only reachable locally. Public requests enter via the main vhost.
server {
    listen 127.0.0.1:8100;
    server_name localhost;
    root /var/www/dotquy/current;
    index index.html;
    access_log /var/log/nginx/dotquy_access.log main;
    error_log /var/log/nginx/dotquy_error.log;
    absolute_redirect off;
    open_file_cache off;

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ^~ /ota/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
